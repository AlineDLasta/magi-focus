
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Magi Focus</title>
</head>
<body>

    <h1>Magi Focus</h1>

    <div class="clock">
        <span id="display">00:00:00</span>
    </div>

    <div class="buttons">
        <button id="start">Iniciar</button>
        <button id="pause">Pausar</button>
        <button id="reset">Zerar</button>
    </div>

    <section>
        <input id="question" placeholder="Pergunte à IA...">
        <button id="ask">Enviar</button>
        <p id="answer"></p>
    </section>

    <h2>Developed by <strong>Aline Lasta</strong></h2>

    <script src="script.js"></script>
</body>
</html>
